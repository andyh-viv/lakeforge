{{- if not .Values.controlPlane.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lakeforge.secretName" . }}
  labels: {{- include "lakeforge.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Keep generated values stable across upgrades. */}}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "lakeforge.secretName" .)) }}
  {{- $prev := dict }}
  {{- if $existing }}{{ $prev = $existing.data }}{{ end }}
  admin-password: {{ if .Values.controlPlane.adminPassword }}{{ .Values.controlPlane.adminPassword | b64enc }}{{ else if hasKey $prev "admin-password" }}{{ index $prev "admin-password" }}{{ else }}{{ randAlphaNum 20 | b64enc }}{{ end }}
  jwt-secret: {{ if .Values.controlPlane.jwtSecret }}{{ .Values.controlPlane.jwtSecret | b64enc }}{{ else if hasKey $prev "jwt-secret" }}{{ index $prev "jwt-secret" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  database-url: {{ include "lakeforge.databaseUrl" . | b64enc }}
{{- end }}
