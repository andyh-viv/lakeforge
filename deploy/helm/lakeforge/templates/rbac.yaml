{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lakeforge.serviceAccountName" . }}
  labels: {{- include "lakeforge.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.forge.namespace }}
  labels: {{- include "lakeforge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
{{- if .Values.serviceAccount.compute.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.compute.name }}
  namespace: {{ .Values.forge.namespace }}
  labels: {{- include "lakeforge.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.compute.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# The control plane creates Deployments/Services for Forge clusters in the compute namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lakeforge.fullname" . }}-cluster-manager
  namespace: {{ .Values.forge.namespace }}
  labels: {{- include "lakeforge.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lakeforge.fullname" . }}-cluster-manager
  namespace: {{ .Values.forge.namespace }}
  labels: {{- include "lakeforge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lakeforge.fullname" . }}-cluster-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "lakeforge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
