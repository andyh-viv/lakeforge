[workspace]
resolver = "2"
members = [
    "crates/forge-proto",
    "crates/forge-common",
    "crates/forge-sql",
    "crates/forge-shuffle",
    "crates/forge-scheduler",
    "crates/forge-executor",
    "crates/forge-driver",
    "crates/forge-client",
    "crates/forge-cli",
    "crates/lakeforge-api",
    "crates/lakeforge-cluster-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/vivanti/lakeforge"
authors = ["Lakeforge Contributors"]
rust-version = "1.85"

[workspace.dependencies]
# Query engine / columnar
arrow = { version = "58", features = ["prettyprint", "ipc"] }
arrow-flight = { version = "58", features = ["flight-sql-experimental"] }
arrow-ipc = "58"
arrow-schema = "58"
datafusion = "53"
datafusion-proto = "53"
deltalake = { version = "0.32", features = ["datafusion", "s3", "gcs", "azure"] }
object_store = { version = "0.13", features = ["aws", "gcp", "azure", "http"] }
parquet = "58"

# Async / network
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
tonic = { version = "0.14", features = ["gzip", "zstd"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Storage / persistence
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "chrono", "uuid", "json", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bytes = "1"
base64 = "0.22"

# Utilities
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
parking_lot = "0.12"
rand = "0.9"
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "9"
argon2 = "0.5"
chacha20poly1305 = "0.10"
url = "2"
humantime = "2"
mime_guess = "2"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
async-stream = "0.3"
regex = "1"
tempfile = "3"
once_cell = "1"
indexmap = "2"
itertools = "0.14"
petgraph = "0.8"
kube = { version = "4", features = ["runtime", "derive", "rustls-tls"], default-features = false }
k8s-openapi = { version = "0.28", features = ["latest"] }
cron = "0.15"
chrono-tz = "0.10"

# Workspace crates
forge-proto = { path = "crates/forge-proto" }
forge-common = { path = "crates/forge-common" }
forge-sql = { path = "crates/forge-sql" }
forge-shuffle = { path = "crates/forge-shuffle" }
forge-scheduler = { path = "crates/forge-scheduler" }
forge-executor = { path = "crates/forge-executor" }
forge-driver = { path = "crates/forge-driver" }
forge-client = { path = "crates/forge-client" }
lakeforge-cluster-manager = { path = "crates/lakeforge-cluster-manager" }

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
debug = 1

[profile.dev]
opt-level = 0
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
