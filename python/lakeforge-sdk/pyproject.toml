[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeforge-sdk"
version = "0.1.0"
description = "Python SDK, dbutils and CLI for the Lakeforge platform (Databricks-compatible REST API)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
dev = ["pytest>=7"]

[project.scripts]
lakeforge = "lakeforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lakeforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
